<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100">
    <nav class="border-b border-neutral-800 px-8 py-6">
      <div class="mx-auto flex max-w-3xl justify-between">
        <a href="/" class="font-bold text-green-500">Mister Robot</a
        ><a href="/pages/jogos">Estoque</a>
      </div>
    </nav>
    <main class="mx-auto max-w-3xl px-8 py-12">
      <h1
        class="mb-8 text-3xl font-bold"
        th:text="${jogoId == null} ? 'Novo jogo' : 'Editar jogo'"
      >
        Jogo
      </h1>
      <p id="mensagem" class="mb-8 hidden border px-8 py-4"></p>
      <form
        id="jogoForm"
        class="grid gap-8 border border-neutral-800 bg-neutral-900 p-8 md:grid-cols-2"
      >
        <div class="md:col-span-2">
          <label
            for="titulo"
            class="mb-8 block text-sm font-medium text-neutral-300"
            >Título</label
          ><input
            id="titulo"
            name="titulo"
            required
            class="w-full border border-neutral-700 bg-neutral-950 px-8 py-4"
            th:value="${jogo != null} ? ${jogo.titulo} : ''"
          />
        </div>
        <div class="md:col-span-2">
          <label
            for="descricao"
            class="mb-8 block text-sm font-medium text-neutral-300"
            >Descrição</label
          ><input
            id="descricao"
            name="descricao"
            class="w-full border border-neutral-700 bg-neutral-950 px-8 py-4"
            th:value="${jogo != null} ? ${jogo.descricao} : ''"
          />
        </div>
        <div>
          <label
            for="genero"
            class="mb-8 block text-sm font-medium text-neutral-300"
            >Gênero</label
          ><input
            id="genero"
            name="genero"
            class="w-full border border-neutral-700 bg-neutral-950 px-8 py-4"
            th:value="${jogo != null} ? ${jogo.genero} : ''"
          />
        </div>
        <div>
          <label
            for="desenvolvedora"
            class="mb-8 block text-sm font-medium text-neutral-300"
            >Desenvolvedora</label
          ><input
            id="desenvolvedora"
            name="desenvolvedora"
            class="w-full border border-neutral-700 bg-neutral-950 px-8 py-4"
            th:value="${jogo != null} ? ${jogo.desenvolvedora} : ''"
          />
        </div>
        <div>
          <label
            for="idadeMinima"
            class="mb-8 block text-sm font-medium text-neutral-300"
            >Idade mínima</label
          ><input
            id="idadeMinima"
            name="idadeMinima"
            type="number"
            min="0"
            class="w-full border border-neutral-700 bg-neutral-950 px-8 py-4"
            th:value="${jogo != null} ? ${jogo.idadeMinima} : 0"
          />
        </div>
        <div>
          <label
            for="quantidadeEstoque"
            class="mb-8 block text-sm font-medium text-neutral-300"
            >Quantidade em estoque</label
          ><input
            id="quantidadeEstoque"
            name="quantidadeEstoque"
            type="number"
            min="0"
            required
            class="w-full border border-neutral-700 bg-neutral-950 px-8 py-4"
            th:value="${jogo != null} ? ${jogo.quantidadeEstoque} : 0"
          />
        </div>
        <div class="md:col-span-2">
          <label
            for="preco"
            class="mb-8 block text-sm font-medium text-neutral-300"
            >Preço</label
          ><input
            id="preco"
            name="preco"
            type="number"
            min="0"
            step="0.01"
            required
            class="w-full border border-neutral-700 bg-neutral-950 px-8 py-4"
            th:value="${jogo != null} ? ${jogo.preco} : 0"
          />
        </div>
        <button
          type="submit"
          class="bg-green-500 px-8 py-4 font-semibold text-neutral-950 md:col-span-2"
        >
          Salvar
        </button>
      </form>
    </main>
    <script th:inline="javascript">
      const jogoId = /*[[${jogoId}]]*/ null;
      const form = document.getElementById("jogoForm");
      const mensagem = document.getElementById("mensagem");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        data.idadeMinima = Number(data.idadeMinima);
        data.quantidadeEstoque = Number(data.quantidadeEstoque);
        data.preco = Number(data.preco);
        try {
          const response = await fetch(
            jogoId ? `/estoque/${jogoId}` : "/estoque",
            {
              method: jogoId ? "PUT" : "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            },
          );
          const body = await response.text();
          if (!response.ok) throw new Error(body);
          window.location.href = "/pages/jogos";
        } catch (error) {
          mensagem.textContent =
            error.message || "Não foi possível salvar o jogo";
          mensagem.className =
            "mb-8 border border-red-500 bg-red-500/10 px-8 py-4 text-red-300";
        }
      });
    </script>
  </body>
</html>
