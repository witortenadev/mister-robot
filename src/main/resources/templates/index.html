<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mister Robot</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100">
    <nav class="border-b border-neutral-800 bg-neutral-950/90 px-8 py-6">
      <div class="mx-auto flex max-w-6xl items-center justify-between">
        <a href="/" class="text-xl font-bold text-green-500">Mister Robot</a>
        <div class="space-x-6 text-sm">
          <a href="/pages/jogos" class="hover:text-green-500">Estoque</a
          ><a href="/pages/vendas" class="hover:text-green-500">Vendas</a>
        </div>
      </div>
    </nav>
    <main class="mx-auto max-w-6xl px-8 py-12">
      <h1 class="mb-8 text-3xl font-bold">Painel</h1>
      <section class="grid gap-6 md:grid-cols-3">
        <article class="border border-neutral-800 bg-neutral-900 p-8">
          <p class="text-neutral-400">Jogos cadastrados</p>
          <p class="mt-4 text-4xl font-bold text-green-500" th:text="${jogos}">
            0
          </p>
        </article>
        <article class="border border-neutral-800 bg-neutral-900 p-8">
          <p class="text-neutral-400">Unidades em estoque</p>
          <p
            class="mt-4 text-4xl font-bold text-green-500"
            th:text="${estoque}"
          >
            0
          </p>
        </article>
        <article class="border border-neutral-800 bg-neutral-900 p-8">
          <p class="text-neutral-400">Vendas realizadas</p>
          <p class="mt-4 text-4xl font-bold text-green-500" th:text="${vendas}">
            0
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
